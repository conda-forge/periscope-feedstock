{% set name = "periscope" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/anishathalye/periscope/archive/v{{ version }}.tar.gz
  sha256: 05e73a339404ad648d02300781813f36ec425c423fbee4d5dcb4f5371ad742b1

build:
  number: 0

requirements:
  build:
    - {{ compiler('go-nocgo') }}
    - go-licenses

test:
  commands:
    - psc --help

about:
  home: https://github.com/anishathalye/periscope
  license: GPL-3.0-only
  license_file:
    - LICENSE.txt
    - license-files/
  summary: Organize and de-duplicate your files without losing data
  dev_url: https://github.com/anishathalye/periscope

extra:
  recipe-maintainers:
    - danielnachun
